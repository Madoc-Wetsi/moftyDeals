<!doctype html>
<html>
  <head>
    <title>Achish Dealership</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="../css/page.css" />
    <link rel="stylesheet" href="../css/header.css">
  </head>

  <body>
    <!--header section-->
    <header>
            <h2>Mofty <span style="color: red;">Dealership</span></h2>
            <div>
            <a href="#">Home</a>
            <a href="#">Cars</a>
            <a href="#">About</a>
            <a href="#">Services</a>
            <a href="#">Contact</a>
            <a href="#">More</a>
            <a href="#">Login</a>
            <a href="#">Register</a>
            </div>

        </header>
      

    <!--navigational section-->
    <div class="navigation" id="navigation" hidden="">
      <div class="navigation-header">
        <button class="close" id="closebtn" title="click to close">
          <i class="fa fa-times"></i>
        </button>
      </div>

      <div class="links">
        <a href="#">My Account<i class="fa fa-chevron-right"></i></a>
        <a href="#">About</a>
        <a href="#">Contact</a>
      </div>
    </div>

    <!--Order section-->
    <main>
      <div class="mini-sidebar">
        <input type="text" placeholder="Search for cars" />
        <button class="searchbtn">Search</button>
        <h3>Filter by Price</h3>
        <input type="number" placeholder="Min Price" />
        <input type="number" placeholder="Max Price" />
        <button class="filterbtn">Filter</button>
        
      </div>
      <div class="parentbox"></div>
    </main>

    <script src="../js/button.js"></script>
    <script src="../js/cars.js"></script>
  </body>
</html>

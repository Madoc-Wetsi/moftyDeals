<!doctype html>
<html>
  <head>
    <title>Achish Dealership</title>
    <link rel="stylesheet" href="../css/page.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>

  <body>
    <!--header section-->
    <header>
      <div class="menu-cart">
        <button class="menubtn" id="menubtn" title="click to open">
          <i class="fa fa-bars"></i>
        </button>
        <a href="">
          <h2>Mofty Dealership</h2>
        </a>

        <div class="links-head">
        <a href="#">My Account</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
      </div>

        <div>
          <a href="#">
            <i class="fa fa-user"></i>
          </a>
        </div>
      </div>
    </header>

    <!--navigational section-->
    <div class="navigation" id="navigation" hidden="">
      <div class="navigation-header">
        <button class="close" id="closebtn" title="click to close">
          <i class="fa fa-times"></i>
        </button>
      </div>

      <div class="links">
        <a href="#">My Account<i class="fa fa-chevron-right"></i></a>
        <a href="#">About</a>
        <a href="#">Contact</a>
      </div>
    </div>

    <!--Order section-->
    <main>
      <div class="mini-sidebar">
        <input type="text" placeholder="Search for cars" />
      </div>
      <div class="parentbox"></div>
    </main>

    <script src="/js/button.js"></script>
    <script src="/js/cars.js"></script>
  </body>
</html>
